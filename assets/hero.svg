<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Georgia, &#39;Times New Roman&#39;, serif" role="img" aria-label="ACDB — Active Causal Discovery Benchmark">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b08968"></path>
    </marker>
  </defs>

  
  <rect width="1200" height="300" rx="12" fill="#fbfaf7"></rect>
  <rect x="1" y="1" width="1198" height="298" rx="12" fill="none" stroke="#e7e2d8" stroke-width="1.5"></rect>

  
  <line x1="700" y1="54" x2="700" y2="246" stroke="#e7e2d8" stroke-width="1.5"></line>

  
  <text x="64" y="74" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" letter-spacing="3" fill="#b08968">NEURIPS 2026   ·   DIAGNOSTIC BENCHMARK</text>
  <text x="60" y="166" font-size="90" font-weight="700" letter-spacing="1" fill="#1a1a1a">ACDB</text>
  <text x="64" y="200" font-size="24" font-style="italic" fill="#3a3a3a">Active Causal Discovery Benchmark</text>
  <rect x="64" y="218" width="118" height="4" rx="2" fill="#b08968"></rect>
  <text x="64" y="250" font-size="15" fill="#555">Recover a hidden causal DAG from observational data,</text>
  <text x="64" y="272" font-size="15" fill="#555">under a strict intervention budget. Then get scored — honestly.</text>
  <text x="64" y="294" font-family="ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="12" fill="#b08968">observe()  →  intervene()  →  submit_graph()</text>

  

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="ACDB protocol loop: observe, intervene, submit">
  <rect width="820" height="200" fill="#fbfaf7"/>

  <!-- three protocol stages as cards -->
  <defs>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- OBSERVE -->
  <g>
    <rect x="40" y="60" width="180" height="80" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="130" y="92" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">observe()</text>
    <text x="130" y="116" font-size="12" fill="#666" text-anchor="middle">one observational</text>
    <text x="130" y="132" font-size="12" fill="#666" text-anchor="middle">sample panel</text>
  </g>

  <!-- INTERVENE (loops) -->
  <g>
    <rect x="320" y="60" width="180" height="80" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="410" y="92" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">intervene()</text>
    <text x="410" y="116" font-size="12" fill="#666" text-anchor="middle">do(X=v), budgeted,</text>
    <text x="410" y="132" font-size="12" fill="#666" text-anchor="middle">repeat while budget</text>
    <!-- self-loop arrow -->
    <path d="M470,60 C490,30 330,30 350,60" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#flow)"/>
  </g>

  <!-- SUBMIT -->
  <g>
    <rect x="600" y="60" width="180" height="80" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="690" y="92" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">submit_graph()</text>
    <text x="690" y="116" font-size="12" fill="#666" text-anchor="middle">directed + undirected</text>
    <text x="690" y="132" font-size="12" fill="#666" text-anchor="middle">edges, ends episode</text>
  </g>

  <!-- flow arrows -->
  <line x1="222" y1="100" x2="316" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#flow)"/>
  <line x1="502" y1="100" x2="596" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#flow)"/>

  <!-- animated accent highlight sweeping the three stages -->
  <rect x="40" y="60" width="180" height="80" rx="6" fill="none" stroke="#b08968" stroke-width="3">
    <animate attributeName="x" values="40;320;600;600" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="180;180;180;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0.15;1" keyTimes="0;0.75;0.85;0.92;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="410" y="180" font-size="13" fill="#8a8a8a" text-anchor="middle" font-style="italic">
    fixed protocol, scored against the true DAG and its CPDAG ceiling
  </text>
</svg>
